services:
  pg:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${PG_USER:-boilerplate}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-boilerplate}
      POSTGRES_DB: ${PG_DATABASE_NAME:-boilerplate}
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 5

  migrator:
    build:
      context: .
      dockerfile: config/migration.Dockerfile
    environment:
      PG_DSN: postgres://${PG_USER:-boilerplate}:${PG_PASSWORD:-boilerplate}@pg:5432/${PG_DATABASE_NAME:-boilerplate}?sslmode=disable
      MIGRATION_DIR: migrations
    depends_on:
      pg:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      dockerfile: config/Dockerfile
    ports:
      - "${HTTP_PORT:-8080}:8080"
    environment:
      HTTP_HOST: "0.0.0.0"
      HTTP_PORT: "8080"
      PG_DSN: postgres://${PG_USER:-boilerplate}:${PG_PASSWORD:-boilerplate}@pg:5432/${PG_DATABASE_NAME:-boilerplate}?sslmode=disable
    depends_on:
      migrator:
        condition: service_completed_successfully
    restart: on-failure

volumes:
  postgres_data:
